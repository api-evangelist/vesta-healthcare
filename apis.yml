name: Vesta Healthcare
description: 'Vesta Healthcare is a clinical and technology services organization for high-need, frail
  seniors receiving home-based care. It connects caregiver insights to the broader care team, delivering
  24/7 telehealth support, remote patient monitoring, and chronic care management. Vesta partners with
  home care agencies, health plans, and providers to run value-based population health programs that
  emphasize clinical quality and personalized engagement, with services covered through Medicare,
  Medicare Supplemental, and many Medicare Advantage plans. The company (formerly HT Health) is backed
  by Lux Capital. No public developer/API surface was found during enrichment.'
